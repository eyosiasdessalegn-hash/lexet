org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- LexET build configuration (override in ~/.gradle/gradle.properties or with -P) ---
# Feed address built into the app (users can change it under Settings > Server). Empty = the app
# asks for it. GitHub builds set it to the repository's Pages address automatically.
# Examples: https://yourname.github.io/lexet/   http://10.0.2.2:8080/ (local backend, from the emulator)
lexet.apiUrl=
# Optional Firebase Cloud Messaging. Leave empty to rely on background polling only.
lexet.fcm.appId=
lexet.fcm.apiKey=
lexet.fcm.projectId=
lexet.fcm.senderId=
lexet.fcm.topic=lexet-et
